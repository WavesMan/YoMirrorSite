name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yomirror_test
          POSTGRES_USER: yomirror
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: yomirror
      PG_PASSWORD: test
      PG_DB: yomirror_test
      REDIS_ADDR: localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Unit tests
        run: |
          go test ./... -short -coverprofile=unit.out -covermode=atomic -count=1

      - name: Integration tests with MinIO
        run: |
          docker run -d --name minio-int \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 minio/minio server /data --quiet
          sleep 5
          curl -sf http://localhost:9000/minio/health/live
          go test ./... -tags=integration -coverprofile=integration.out -covermode=atomic -count=1
          docker stop minio-int && docker rm minio-int

      - name: Coverage report
        run: |
          echo "mode: atomic" > coverage.out
          tail -n +2 unit.out >> coverage.out
          tail -n +2 integration.out >> coverage.out
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Coverage summary
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "## Coverage: $TOTAL" >> $GITHUB_STEP_SUMMARY

      - name: Go vet
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Install & build
        run: |
          cd web
          pnpm install
          npx vue-tsc --noEmit
          npx vite build
