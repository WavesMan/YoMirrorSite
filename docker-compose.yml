version: "3.8"

services:
  app:
    build: .
    ports:
      - "${ADDR:-8080}:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - REDIS_ADDR=redis:6379

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yomirror
      POSTGRES_USER: yomirror
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    # 生产环境不暴露数据库端口到宿主机
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomirror"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  pgdata: