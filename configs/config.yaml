# YoMirrorSite 开发配置

server:
  port: 8080
  goroutine_pool_size: 100
  parallel_download_threads: 5

redis:
  addr: "localhost:6379"
  password: "${REDIS_PASSWORD}"
  db: 0

cache:
  filesListRefreshIntervalSec: 300
  local_cache:
    enabled: true
    size: 1000
    mode: "lru"
    hot_data_refresh_sec: 30
    hot_data_threshold: 10

s3:
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  endpoint: "http://localhost:9000"
  bucket_name: "yomirror"
  listen_dir: "mirrors/"
  cors:
    allowed_origins:
      - "http://localhost:5173"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    allowed_headers:
      - "Authorization"
      - "Content-Type"
    max_age_seconds: 3600

mirror:
  software_list:
    - id: "vscode"
      name: "Visual Studio Code"
      github_repo: "microsoft/vscode"
      category: "editor"
      tags: ["开发工具", "编辑器", "微软"]
      filter_assets:
        - platform: "windows-x64"
          pattern: "VSCode-win32-x64-*.zip"
      sync_prerelease: false
  sync:
    interval_minutes: 30
    github_token: "${GITHUB_TOKEN}"
    max_concurrent: 3
    retry_attempts: 3

# PostgreSQL
postgres:
  host: "localhost"
  port: 5432
  user: "yomirror_dev"
  password: "${PG_PASSWORD}"
  dbname: "YoMirrorSite"
  sslmode: "disable"
  max_conns: 10